[package]
name = "fpt"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]
nfs = ["nfs3_client", "async-channel"]
smb = ["dep:smb_client", "dep:sspi"]

[dependencies]
libc = "0.2"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
chrono = { version = "0.4", features = ["clock"] }
fern = "0.6"
env_logger = "0.11"
tempfile = "3.0"  # For tests
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
walkdir = "2.5"
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
crossbeam = "0.8"
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.29", features = ["bundled"], optional = true }
nfs3_client = { version = "0.8.0", features = ["tokio"], optional = true }
async-channel = { version = "2.3", optional = true }
smb_client = { package = "smb", version = "0.11.1", default-features = false, features = ["async", "sign", "encrypt", "compress"], optional = true }
sspi = { version = "0.19.2", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "resource"] }

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.0"
base64 = "0.22"
exacl = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Foundation",
  "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.0"


[profile.release]
debug = true

